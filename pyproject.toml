[project]
name = "romance-arena"
version = "0.1.0"
description = "LLM Romance Arena MVP"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0.1",
  "bitsandbytes>=0.45.0",
  "fastapi>=0.115.0",
  "gradio>=5.0.0",
  "httpx>=0.27.0",
  "langgraph>=0.2.0",
  "peft>=0.14.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.8.0",
  "scikit-learn>=1.5.0",
  "sentencepiece>=0.2.0",
  "sqlite-vec>=0.1.6",
  "timm>=1.0.0",
  "transformers>=4.57.0",
  "uvicorn>=0.30.0",
  "vllm>=0.8.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["date_saya_backend"]
